              - button "Outline" [ref=f5e474] [cursor=pointer]
            - article [ref=f5e478]:
              - generic [ref=f5e479]:
                - heading "openMotor" [level=1] [ref=f5e480]
                - 'link "Permalink: openMotor" [ref=f5e481] [cursor=pointer]':
                  - /url: "#openmotor"
              - paragraph [ref=f5e484]:
                - link [ref=f5e485] [cursor=pointer]:
                  - /url: /reilleya/openMotor/blob/staging/resources/oMIconCycles.png
                  - img "Logo" [ref=f5e486]
              - generic [ref=f5e487]:
                - heading "Overview" [level=2] [ref=f5e488]
                - 'link "Permalink: Overview" [ref=f5e489] [cursor=pointer]':
                  - /url: "#overview"
              - paragraph [ref=f5e492]: openMotor is an open-source internal ballistics simulator for rocket motor experimenters. The software estimates a rocket motor's chamber pressure and thrust based on propellant properties, grain geometry, and nozzle specifications. It uses the Fast Marching Method to determine how a propellant grain regresses, which allows the use of arbitrary core geometries.
              - paragraph [ref=f5e493]: "Current Features:"
              - list [ref=f5e494]:
                - listitem [ref=f5e495]: Metric and imperial units
                - listitem [ref=f5e496]: Support for common grain geometries such as BATES, Finocyl, Star and more
                - listitem [ref=f5e497]: Loading custom grain geometry from DXF files
                - listitem [ref=f5e498]: A propellant editor that allows the user to enter the properties of as many propellants as they wish
                - listitem [ref=f5e499]: The grain editor displays how a grain will regress to cut down on the guesswork involved in tweaking geometry
                - listitem [ref=f5e500]: ENG file exporting
                - listitem [ref=f5e501]: Burnsim importing and exporting
                - listitem [ref=f5e502]: A UI that supports saving and loading designs along with undo and redo
                - listitem [ref=f5e503]: Tools for easily tweaking and optimizing your design
              - paragraph [ref=f5e504]:
                - text: The calculations involved were sourced from Rocket Propulsion Elements by George Sutton and from
                - link "Richard Nakka's website" [ref=f5e505] [cursor=pointer]:
                  - /url: https://www.nakka-rocketry.net/rtheory.html
                - text: .
              - paragraph [ref=f5e506]:
                - link [ref=f5e507] [cursor=pointer]:
                  - /url: https://camo.githubusercontent.com/3a01b63d8ba7b73cd81a26dd25d1bf649a3ff6c21e24bc9fb4564482f6e98e80/68747470733a2f2f7265696c6c65792e6e65742f6f70656e4d6f746f722f73637265656e73686f742e706e67
                  - img "Screenshot" [ref=f5e508]
              - generic [ref=f5e509]:
                - heading "Download" [level=2] [ref=f5e510]
                - 'link "Permalink: Download" [ref=f5e511] [cursor=pointer]':
                  - /url: "#download"
              - paragraph [ref=f5e514]:
                - text: You can download the latest version for your system
                - link "here" [ref=f5e515] [cursor=pointer]:
                  - /url: https://github.com/reilleya/openMotor/releases/latest
                - text: . From there, just unzip the file and run it. Alternatively, you can run it from source code to get the latest features. openMotor is avaliable on the AUR as
                - code [ref=f5e516]: openmotor
                - text: and on debian apt as
                - code [ref=f5e517]: openmotor
              - generic [ref=f5e518]:
                - heading "Building from Source" [level=2] [ref=f5e519]
                - 'link "Permalink: Building from Source" [ref=f5e520] [cursor=pointer]':
                  - /url: "#building-from-source"
              - paragraph [ref=f5e523]:
                - text: The program is currently being developed using python 3.10. The dependencies are outlined in
                - code [ref=f5e524]: requirements.txt
                - text: ", the main ones include"
                - code [ref=f5e525]: PyQt6
                - text: ","
                - code [ref=f5e526]: matplot
                - text: ","
                - code [ref=f5e527]: numpy
                - text: ","
                - code [ref=f5e528]: scipy
                - text: ","
                - code [ref=f5e529]: scikit-fmm
                - text: ", and"
                - code [ref=f5e530]: scikit-image
                - text: . Because the PyQt6 bindings are used for the GUI, Qt6 must also be installed.
              - paragraph [ref=f5e531]: "The easiest way to build/run from source code is to clone the repository and install the required dependencies into a virtual environment:"
              - generic [ref=f5e532]:
                - code [ref=f5e534]: $ git clone https://github.com/reilleya/openMotor $ cd openMotor $ python3 -m venv .venv $ source .venv/bin/activate $ pip install -r requirements.txt
                - button "Copy code to clipboard" [ref=f5e536] [cursor=pointer]
              - paragraph [ref=f5e540]:
                - text: If you are using a version of python that does not have a prebuilt version of one of the dependencies, the
                - code [ref=f5e541]: pip
                - text: "command above might fail with an error like:"
              - generic [ref=f5e542]:
                - code [ref=f5e544]: "Failed building wheel for scikit-fmm skfmm/fmm.cpp:4:10: fatal error: Python.h: No such file or directory"
                - button "Copy code to clipboard" [ref=f5e546] [cursor=pointer]
              - paragraph [ref=f5e550]:
                - text: The fix is to install
                - code [ref=f5e551]: python3-dev
                - text: or the equivalent with your system package manager.
              - paragraph [ref=f5e552]:
                - text: If you are running Windows and get errors like
                - code [ref=f5e553]: DLL load failed while importing _cext
                - text: when trying to run the application after installing the dependencies, you may need to install the latest Microsoft Visual C++ Redistributable.
              - generic [ref=f5e554]:
                - heading "UI Files:" [level=4] [ref=f5e555]
                - 'link "Permalink: UI Files:" [ref=f5e556] [cursor=pointer]':
                  - /url: "#ui-files"
              - paragraph [ref=f5e559]:
                - text: openMotor uses Qt Designer to lay out the GUI, which generates
                - code [ref=f5e560]: .ui
                - text: files describing the user interface. We use
                - code [ref=f5e561]: pyuic6
                - text: to compile these files into Python source code which is then included in the program as ordinary source code.
              - paragraph [ref=f5e562]: "Because these autogenerated files are not committed to the source tree, you must build them by running:"
              - generic [ref=f5e563]:
                - code [ref=f5e565]: $ python setup.py build_ui
                - button "Copy code to clipboard" [ref=f5e567] [cursor=pointer]
              - paragraph [ref=f5e571]:
                - text: Note that if you make changes to the UI using the
                - code [ref=f5e572]: .ui
                - text: forms, you must re-build using the same command.
              - generic [ref=f5e573]:
                - heading "Cython Files:" [level=4] [ref=f5e574]
                - 'link "Permalink: Cython Files:" [ref=f5e575] [cursor=pointer]':
                  - /url: "#cython-files"
              - paragraph [ref=f5e578]: to speed up some more computationally expensive parts of the codebase, openMotor uses the Cython programming language to run calculations in C.
              - paragraph [ref=f5e579]: "because the Cython code must be compiled separately for each system, you must build the library by running:"
              - generic [ref=f5e580]:
                - code [ref=f5e582]: $ python setup.py build_ext --inplace
                - button "Copy code to clipboard" [ref=f5e584] [cursor=pointer]
              - paragraph [ref=f5e588]:
                - text: Note that if you make changes to any of the
                - code [ref=f5e589]: .pyx
                - text: files, you must re-compile the Cython library using the same command.
              - generic [ref=f5e590]:
                - heading "Run the Application:" [level=4] [ref=f5e591]
                - 'link "Permalink: Run the Application:" [ref=f5e592] [cursor=pointer]':
                  - /url: "#run-the-application"
              - paragraph [ref=f5e595]:
                - text: "Once everything is set up, you can start openMotor by running:"
                - code [ref=f5e596]: python main.py
              - generic [ref=f5e597]:
                - heading [level=6] [ref=f5e598]:
                  - text: "Note: On some systems, Python 2 and 3 are installed simultaneously, so you may have to specify which version to run when creating the venv. After the venv has been activated, the programs"
                  - code [ref=f5e599]: python
                  - text: and
                  - code [ref=f5e600]: pip
                  - text: are aliased to the python runtime specific for your venv, so use those (instead of
                  - code [ref=f5e601]: pip3
                  - text: and
                  - code [ref=f5e602]: python3
                  - text: ", on e.g. Debian Linux)"
                - 'link "Permalink: Note: On some systems, Python 2 and 3 are installed simultaneously, so you may have to specify which version to run when creating the venv. After the venv has been activated, the programs python and pip are aliased to the python runtime specific for your venv, so use those (instead of pip3 and python3, on e.g. Debian Linux)" [ref=f5e603] [cursor=pointer]':
                  - /url: "#note-on-some-systems-python-2-and-3-are-installed-simultaneously-so-you-may-have-to-specify-which-version-to-run-when-creating-the-venv-after-the-venv-has-been-activated-the-programs-python-and-pip-are-aliased-to-the-python-runtime-specific-for-your-venv-so-use-those-instead-of-pip3-and-python3-on-eg-debian-linux"
              - generic [ref=f5e606]:
                - heading "Data Files" [level=2] [ref=f5e607]
                - 'link "Permalink: Data Files" [ref=f5e608] [cursor=pointer]':
                  - /url: "#data-files"
              - paragraph [ref=f5e611]:
                - text: openMotor uses
                - link "YAML" [ref=f5e612] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/YAML
                - text: for data storage. Motor files have the extension
                - code [ref=f5e613]: .ric
                - text: to differentiate them, but internally they are YAML and can be edited in a text editor if desired. The recommended MIME type for these files is
                - code [ref=f5e614]: application/vnd.openmotor+yaml
                - text: .
              - paragraph [ref=f5e615]:
                - text: The remaining user information, like propellant data and preferences, is stored in plain YAML files in
                - code [ref=f5e616]: <AppData>\Local\openMotor
                - text: on Windows,
                - code [ref=f5e617]: /Users/<username>/Library/Application Support/openMotor
                - text: on Mac OS, and
                - code [ref=f5e618]: /home/<username>/.local/share/openMotor
                - text: on Linux.
              - generic [ref=f5e619]:
                - heading "License" [level=2] [ref=f5e620]
                - 'link "Permalink: License" [ref=f5e621] [cursor=pointer]':
                  - /url: "#license"
              - paragraph [ref=f5e624]: openMotor is released under the GNU GPL v3 license. The source code is distributed so you can build cool stuff with it, and so you don't have to trust the calculations are being done correctly. Check for yourself (and file an issue ticket!) if you doubt the results.
              - generic [ref=f5e625]:
                - heading "Contributing" [level=2] [ref=f5e626]
                - 'link "Permalink: Contributing" [ref=f5e627] [cursor=pointer]':
                  - /url: "#contributing"
              - paragraph [ref=f5e630]: As openMotor is open source, one of the goals of the project is to have as many eyes on the code as possible. I believe this is the best way to avoid bugs and also the easiest way to get new features added to the software. If you have ideas on how to improve the program or find an error, please open an issue ticket for discussion or file a pull request if possible.
