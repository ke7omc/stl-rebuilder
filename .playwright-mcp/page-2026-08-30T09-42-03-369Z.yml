        - heading "SmartScreen reputation for Windows app developers" [level=1] [ref=f133e102]
        - generic: 
        - generic [ref=f133e104]:
          - generic [ref=f133e105]: ﾃ
          - button "Summarize this article for me" [ref=f133e107] [cursor=pointer]
        - generic [ref=f133e109]:
          - paragraph [ref=f133e110]: Microsoft Defender SmartScreen checks the reputation of downloaded files before allowing them to run. Understanding how reputation works can help avoid warnings when users download or run your files.
          - generic [ref=f133e111]:
            - paragraph [ref=f133e112]:
              - generic [ref=f133e113]: 
              - text: Tip
            - paragraph [ref=f133e115]:
              - strong [ref=f133e116]: The simplest way to avoid SmartScreen warnings is to publish through the Microsoft Store.
              - text: Store-distributed apps are signed by a Microsoft certificate and are never subject to SmartScreen download warnings. The remainder of this article applies to apps distributed outside the Store.
          - generic [ref=f133e117]:
            - 'link "Section titled: How SmartScreen reputation works" [ref=f133e118] [cursor=pointer]':
              - /url: "#how-smartscreen-reputation-works"
              - text: 
            - heading "How SmartScreen reputation works" [level=2] [ref=f133e119]
          - paragraph [ref=f133e120]: "SmartScreen evaluates two signals when a user downloads and runs a file:"
          - list [ref=f133e121]:
            - listitem [ref=f133e122]:
              - strong [ref=f133e123]: Publisher reputation
              - text: — Is the file signed? Is the signing certificate from a known, trusted publisher?
            - listitem [ref=f133e124]:
              - strong [ref=f133e125]: File hash reputation
              - text: — Has this specific file been downloaded by users without indications of malicious behavior?
          - paragraph [ref=f133e126]: A negative or unknown reputation for a file's hash or its publisher's certificate can cause warnings to show. Even when signed, a newly created binary could still show a SmartScreen warning until its hash or publisher certificate accumulates sufficient evidence of positive reputation.
          - paragraph [ref=f133e127]: When a file is not signed, SmartScreen reputation must build for each new version of your files, starting with zero reputation. Reputation cannot transfer from previous versions unless both were signed using the same publisher identity.
          - generic [ref=f133e128]:
            - 'link "Section titled: Certificate options and their SmartScreen implications" [ref=f133e129] [cursor=pointer]':
              - /url: "#certificate-options-and-their-smartscreen-implications"
              - text: 
            - heading "Certificate options and their SmartScreen implications" [level=2] [ref=f133e130]
          - paragraph [ref=f133e131]: To reduce the likelihood of interruption, you should sign all of your files with a valid certificate.
          - button "Expand table" [ref=f133e133] [cursor=pointer]:
            - generic [ref=f133e134]: ﾉ
          - table "Certificate options and their SmartScreen implications" [ref=f133e138]:
            - rowgroup [ref=f133e139]:
              - row [ref=f133e140]:
                - columnheader "Certificate type" [ref=f133e141]
                - columnheader "First-download SmartScreen behavior" [ref=f133e142]
            - rowgroup [ref=f133e143]:
              - row [ref=f133e144]:
                - cell "Microsoft Store" [ref=f133e145]
                - cell "✅ No warning — covered by Microsoft's certificate" [ref=f133e146]
              - row [ref=f133e147]:
                - cell "Valid Certificate (OV/EV)" [ref=f133e148]
                - cell "⚠️ Warning — app flagged as unrecognized until reputation accumulates; verified publisher name is displayed" [ref=f133e149]
              - row [ref=f133e150]:
                - cell "No signature" [ref=f133e151]
                - cell "⚠️ Warning — \"Windows protected your PC\"; User must choose \"Run anyway\" before the app can run. Enterprise policy can prevent continuation entirely." [ref=f133e152]
              - row [ref=f133e153]:
                - cell "Self-signed Certificate" [ref=f133e154]
                - cell "⚠️ Warning — Same behavior as no signature" [ref=f133e155]
          - generic [ref=f133e156]:
            - paragraph [ref=f133e157]:
              - generic [ref=f133e158]: ７
              - text: Note
            - paragraph [ref=f133e160]: EV certificates no longer bypass SmartScreen. Years ago, signing files with an Extended Validation (EV) code signing certificate would result in positive SmartScreen reputation by default, but this behavior no longer exists. EV certificates may matter for enterprise procurement, but they no longer impact SmartScreen behavior. Paying a premium for EV solely to avoid SmartScreen warnings is no longer justified.
          - generic [ref=f133e161]:
            - 'link "Section titled: Microsoft Store (recommended)" [ref=f133e162] [cursor=pointer]':
              - /url: "#microsoft-store-recommended"
              - text: 
            - heading "Microsoft Store (recommended)" [level=3] [ref=f133e163]
          - paragraph [ref=f133e164]: Apps published through the Microsoft Store are re-signed by Microsoft and carry full reputation. Users will never see a SmartScreen warning for a Store-installed app.
          - generic [ref=f133e165]:
            - 'link "Section titled: Artifact Signing (formerly Trusted Signing)" [ref=f133e166] [cursor=pointer]':
              - /url: "#artifact-signing-formerly-trusted-signing"
              - text: 
            - heading "Artifact Signing (formerly Trusted Signing)" [level=3] [ref=f133e167]
          - paragraph [ref=f133e168]:
            - link "Artifact Signing" [ref=f133e169] [cursor=pointer]:
              - /url: /en-us/azure/trusted-signing/
            - text: "(formerly Trusted Signing) is Microsoft's recommended code signing service for non-Store distribution:"
          - list [ref=f133e170]:
            - listitem [ref=f133e171]:
              - strong [ref=f133e172]: Cost
              - text: — Starts at $9.99/month. See
              - link "Artifact Signing pricing" [ref=f133e173] [cursor=pointer]:
                - /url: https://azure.microsoft.com/pricing/details/artifact-signing/
              - text: .
            - listitem [ref=f133e174]:
              - strong [ref=f133e175]: No hardware token required
              - text: — integrates directly with CI/CD pipelines (GitHub Actions, Azure DevOps)
            - listitem [ref=f133e176]:
              - strong [ref=f133e177]: Identity validation required
              - text: — Microsoft validates your identity before issuing certificates
            - listitem [ref=f133e178]:
              - strong [ref=f133e179]: SmartScreen behavior
              - text: — reputation accumulates over time based on download volume and behavior
          - generic [ref=f133e180]:
            - 'link "Section titled: What to expect when you publish a new app" [ref=f133e181] [cursor=pointer]':
              - /url: "#what-to-expect-when-you-publish-a-new-app"
              - text: 
            - heading "What to expect when you publish a new app" [level=2] [ref=f133e182]
          - list [ref=f133e183]:
            - listitem [ref=f133e184]:
              - strong [ref=f133e185]: "First downloads:"
              - text: Users may see a SmartScreen prompt indicating the app is unrecognized. For signed apps, the publisher name is displayed. Users should proceed only after verifying the source.
            - listitem [ref=f133e186]:
              - strong [ref=f133e187]: "As downloads accumulate:"
              - text: SmartScreen reputation builds up automatically. The prompt will stop appearing once the file hash has sufficient download history. There is no exact threshold, but it can take several weeks and hundreds of clean installs from a wide audience.
            - listitem [ref=f133e188]:
              - strong [ref=f133e189]: "New version:"
              - text: Signing files using a trusted certificate can allow certificate reputation to build, potentially avoiding warnings on new files signed by the same trusted certificate. Unsigned files must build reputation anew with every update.
          - paragraph [ref=f133e190]: There is no need (or mechanism) to manually submit a file for SmartScreen reputation review for consumer endpoints. Reputation builds organically through download volume.
          - generic [ref=f133e191]:
            - paragraph [ref=f133e192]:
              - generic [ref=f133e193]: ７
              - text: Note
            - paragraph [ref=f133e195]:
              - text: Enterprise environments may have different SmartScreen behavior depending on policy configuration; for example, the ability to bypass a SmartScreen warning may be disabled. Enterprises may distribute files from Trusted Intranet locations not subject to SmartScreen review. Enterprise IT administrators may optionally submit files for review via the
              - link "Microsoft Security Intelligence portal" [ref=f133e196] [cursor=pointer]:
                - /url: https://www.microsoft.com/en-us/wdsi/filesubmission
              - text: . This can accelerate trust for internal or managed deployments.
          - generic [ref=f133e197]:
            - 'link "Section titled: Minimizing SmartScreen warnings in practice" [ref=f133e198] [cursor=pointer]':
              - /url: "#minimizing-smartscreen-warnings-in-practice"
              - text: 
            - heading "Minimizing SmartScreen warnings in practice" [level=2] [ref=f133e199]
          - list [ref=f133e200]:
            - listitem [ref=f133e201]:
              - strong [ref=f133e202]: Publish to the Microsoft Store
              - text: where feasible — this is the most reliable way to avoid warnings entirely
            - listitem [ref=f133e203]:
              - strong [ref=f133e204]: Sign every release
              - text: — unsigned files cannot inherit a positive reputation from the signing certificate
            - listitem [ref=f133e205]:
              - strong [ref=f133e206]: Do not modify signed files
              - text: "- Avoid modifying files after signing as doing so can"
              - link "break the signature" [ref=f133e207] [cursor=pointer]:
                - /url: /en-us/windows/win32/secbp/understanding-pe-signatures#security-implications
              - text: depending on client configuration
            - listitem [ref=f133e208]:
              - strong [ref=f133e209]: Do not sign potentially unwanted applications
              - text: "- Avoid signing any file which exhibits"
              - link "malicious or potentially unwanted application" [ref=f133e210] [cursor=pointer]:
                - /url: /en-us/unified-secops/criteria
              - text: behavior, or the certificate may develop
              - strong [ref=f133e211]: negative
              - text: reputation
            - listitem [ref=f133e212]:
              - strong [ref=f133e213]: Use a consistent signing identity
              - text: — changing your signing certificate affects the publisher trust signal
            - listitem [ref=f133e214]:
              - strong [ref=f133e215]: Communicate with early adopters
              - text: — for new apps, let beta users know they may see a SmartScreen prompt on first download, and that they should only proceed after verifying the publisher and confirming they trust the download source
          - generic [ref=f133e216]:
            - paragraph [ref=f133e217]:
              - generic [ref=f133e218]: 
              - text: Tip
            - paragraph [ref=f133e220]: On Windows 11 devices, the Smart App Control feature may supersede SmartScreen Application Reputation. Smart App Control will block execution of unsigned files unless the file has a positive reputation. Smart App Control signature checks apply to all executable files, not just those downloaded from the Internet.
