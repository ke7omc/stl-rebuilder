            - heading "Introduction" [level=1] [ref=f13e88]
            - paragraph [ref=f13e89]: The solution of a finite element simulation is highly dependent on the quality of the mesh. A user should strive to achieve a balance between mesh quality, and time taken for mesh generation and solution. But what is mesh quality and how is it measured? In this article we will explain the various metrics or criteria which ANSYS meshing algorithm utilizes, to determine the quality of a mesh element.
            - heading "Mesh Metrics" [level=1] [ref=f13e90]
            - paragraph [ref=f13e91]: When it comes to mesh elements, symmetry and uniformity are of prime importance. Symmetrical elements with uniform sides are considered high quality elements.
            - paragraph [ref=f13e92]: "The “quality” of a mesh cell can be quantified in several ways. ANSYS performs several geometrical checks on mesh elements in order to determine their quality. These checks, or metrics are:"
            - list [ref=f13e93]:
              - listitem [ref=f13e94]: Element Quality
              - listitem [ref=f13e95]: Aspect Ratio Calculation for Triangles
              - listitem [ref=f13e96]: Aspect Ratio Calculation for Quadrilaterals
              - listitem [ref=f13e97]: Jacobian Ratio
              - listitem [ref=f13e98]: Warping Factor
              - listitem [ref=f13e99]: Parallel Deviation
              - listitem [ref=f13e100]: Maximum Corner Angle
              - listitem [ref=f13e101]: Skewness
              - listitem [ref=f13e102]: Orthogonal Quality
            - paragraph [ref=f13e103]:
              - text: Each of these metrics represent particular geometric aspects of the elements and can be measured by numbers.
              - link "ANSYS help" [ref=f13e104] [cursor=pointer]:
                - /url: https://ansyshelp.ansys.com/account/secured?returnurl=/Views/Secured/corp/v222/en/wb_msh/msh_metrics.html
              - text: provides details on these metrics. Here we will provide a brief summary of each metric (taken from ANSYS documentation [1]) in a way that it can be of benefit to the average FEA analyst, without delving into the mathematical details.
            - heading "Element Quality" [level=2] [ref=f13e105]
            - paragraph [ref=f13e106]: The Element Quality is based on the ratio of the volume to the sum of the square of the edge lengths for 2D quad/tri elements, or the square root of the cube of the sum of the square of the edge lengths for 3D elements.
            - paragraph [ref=f13e107]: The Element Quality is a composite quality metric that ranges between 0 and 1.
            - paragraph [ref=f13e108]: A value of 1 indicates a perfect cube or square while a value of 0 indicates that the element has a zero or negative volume.
            - paragraph [ref=f13e109]: "The following are Ansys recommendations for Element Quality:"
            - figure "Ansys Element Quality Recommendations" [ref=f13e111]:
              - img "Ansys Element Quality Recommendations" [ref=f13e112]
            - heading "Aspect Ratio Calculation for Triangles" [level=2] [ref=f13e114]
            - paragraph [ref=f13e115]: The aspect ratio of a triangle provides a comparison of the “height” and “width” of a triangle.
            - paragraph [ref=f13e116]: It varies from 1 to infinite. A value of 1.0 indicate an equilateral triangle.
            - paragraph [ref=f13e117]: The image below shows triangles with aspect ratios of 1 and 20.
            - figure "Triangles with Aspect Ratios" [ref=f13e119]:
              - img "Triangles with Aspect Ratios" [ref=f13e120]
            - heading "Aspect Ratio Calculation for Quadrilaterals" [level=2] [ref=f13e122]
            - paragraph [ref=f13e123]: The aspect ratio of quadrilaterals provides a comparison of a long side to a short side of the quadrilateral.
            - paragraph [ref=f13e124]: It varies from 1 to infinite. A value of 1.0 indicates a square.
            - paragraph [ref=f13e125]: The image below shows quadrilaterals with aspect ratios of 1 and 20.
            - figure "Quadrilaterals with Aspect Ratios" [ref=f13e127]:
              - img "Quadrilaterals with Aspect Ratios" [ref=f13e128]
            - heading "Jacobian Ratio" [level=2] [ref=f13e130]
            - paragraph [ref=f13e131]: The Jacobian ratio is a measurement of the shape of a given element compared to that of an ideal element. The ideal shape of an element depends on element type. The ideal Jacobian ratio is 1.0 and a good quality mesh has a Jacobian ratio between 1 and 10 for the majority of its elements (90% and above) [2].
            - heading "Warping Factor" [level=2] [ref=f13e132]
            - paragraph [ref=f13e133]: Warping factor is computed and tested for some quadrilateral shell elements, and the quadrilateral faces of bricks, wedges, and pyramids.
            - paragraph [ref=f13e134]: The ideal warping factor is 0. Warping is a measure of twisting and distortion and is best understood by looking at quadrilaterals with varying warping factors.
            - figure "Quadrilateral Shells with various Warping Factors" [ref=f13e136]:
              - img "Quadrilateral Shells with various Warping Factors" [ref=f13e137]
            - figure "Bricks with various Warping Factors" [ref=f13e140]:
              - img "Bricks with various Warping Factors" [ref=f13e141]
            - heading "Parallel Deviation" [level=2] [ref=f13e143]
            - paragraph [ref=f13e144]: Parallel deviation is a measure of how much two parallel sides of a shape deviate. The ideal parallel deviation is 0 for a square.
            - figure "Parallel Deviations for Quadrilaterals" [ref=f13e146]
            - heading "Maximum Corner Angle" [level=2] [ref=f13e148]
            - paragraph [ref=f13e149]: This is the maximum angle between adjacent edges of an element. For a triangle the best maximum angle is 60 degrees. For a quadrilateral it is 90 degrees.
            - figure "Maximum Corner Angle for Triangles" [ref=f13e151]:
              - img "Maximum Corner Angle for Triangles" [ref=f13e152]
            - figure "Maximum Corner Angles for Quadrilaterals" [ref=f13e155]:
              - img "Maximum Corner Angles for Quadrilaterals" [ref=f13e156]
            - heading "Skewness" [level=2] [ref=f13e158]
            - paragraph [ref=f13e159]: Skewness is one of the primary quality measures for a mesh. Skewness determines how close to ideal (equilateral or equiangular) a face or cell is.
            - figure "Triangle and Quadrilateral Skewness" [ref=f13e161]:
              - img "Triangle and Quadrilateral Skewness" [ref=f13e162]
            - figure "ANSYS recommended scale for skewness" [ref=f13e165]:
              - img "ANSYS recommended scale for skewness" [ref=f13e166]
            - heading "Orthogonal Quality" [level=2] [ref=f13e168]
            - paragraph [ref=f13e169]: The range for orthogonal quality is 0-1, where a value of 0 is worst and a value of 1 is best.
            - heading "Summary" [level=2] [ref=f13e170]
            - paragraph [ref=f13e171]:
              - text: It is useful to summarize the information that we have seen so far in a tabular form. We have developed the table shown below for this purpose. You may use this table when
