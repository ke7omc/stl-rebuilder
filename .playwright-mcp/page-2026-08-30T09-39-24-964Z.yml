            - text: where the symbol (rho) designates density,
            - strong [ref=f108e86]: f
            - text: is the mass fraction, and subscripts
            - strong [ref=f108e87]: o
            - text: and
            - strong [ref=f108e88]: f
            - text: "refer to oxidizer and fuel , respectively. If a propellant is comprised of more than two constituents, then the ideal density is given by (where a, b, c... denote the individual constituents): In"
          - link "Table 1" [ref=f108e91] [cursor=pointer]:
            - /url: table1.html
          - text: ", the density for some oxidizers and some fuels is given, as well as a worked example. The"
          - emphasis [ref=f108e92]: actual density
          - text: can be obtained by accurately weighing a grain to determine its mass, and by measuring its volume, with the density expressed as
          - img "equation 3" [ref=f108e94]
          - text: The actual density will usually be some percentage less than the ideal density (typically 94%-97%), owing to tiny voids in the grain, and is dependant upon manufacturing technique. Volume is best obtained by the Archimedes principle, which involves immersion of the grain in an appropriate liquid, and measuring the displaced volume.
          - paragraph [ref=f108e95]:
            - text: The
            - strong [ref=f108e96]: Volumetric Loading Fraction
            - text: is defined as the fraction of
            - emphasis [ref=f108e97]: grain volume
            - text: to
            - emphasis [ref=f108e98]: available chamber volume
            - text: ", and relates the volumetric efficiency of the motor, as well as a measure of performance efficiency:"
          - paragraph
          - paragraph [ref=f108e101]:
            - text: where
            - emphasis [ref=f108e102]: Vp
            - text: is the grain volume,
            - emphasis [ref=f108e103]: Va
            - text: is the available chamber volume,
            - emphasis [ref=f108e104]: It
            - text: is the total impulse (deliverable), and
            - emphasis [ref=f108e105]: Isp
            - text: is the propellant specific impulse.
          - paragraph [ref=f108e106]:
            - text: The
            - strong [ref=f108e107]: Web Fraction
            - text: is the ratio of propellant
            - emphasis [ref=f108e108]: web thickness
            - text: to grain
            - emphasis [ref=f108e109]: outer radius
            - text: ", and is given by:"
          - paragraph
          - paragraph [ref=f108e112]:
            - text: where
            - emphasis [ref=f108e113]:
              - text: t
              - subscript [ref=f108e114]: b
            - text: is the motor burn time. Clearly, to maximize burn duration, it is necessary to maximize the web fraction (i.e. thickness). The "price" for maximizing web thickness is reduction of the grain core diameter. This must be carefully considered, as explained below.
          - paragraph [ref=f108e115]:
            - text: The
            - strong [ref=f108e116]: Port-to-Throat
            - text: area ratio is given by the
            - emphasis [ref=f108e117]: flow channel
            - text: cross-sectional area to the
            - emphasis [ref=f108e118]: nozzle throat
            - text: "cross-sectional area:"
          - paragraph
          - paragraph [ref=f108e121]:
            - text: where
            - emphasis [ref=f108e122]: Ap
            - text: is the flow (channel) area of the grain and
            - emphasis [ref=f108e123]: At
            - text: is the throat cross-sectional area. Gas velocity along the length of the flow channel is influenced significantly by the magnitude of the port-to-throat area ratio.
            - emphasis [ref=f108e124]: Choked flow
            - text: occurs when the ratio is 1.0, with flow velocity through the port being equal to the flow velocity through the nozzle throat (sonic). Severe erosive burning (core stripping) may occur under such a condition, and is generally avoided in design. The criticality of the port-to-throat ratio, however, depends upon the
            - emphasis [ref=f108e125]: mass flowrate
            - text: at a given location. In fact, a ratio of 1.0 (or less) may be used at the forward end of the grain where mass flowrate is minimum. The port-to-throat area ratio is often used as an index from which erosive burning tendencies are established. For those propellants where this has not been established, a ratio of 2.0 to 3.0 (dependant upon grain L/D ratio) is suggested.
          - paragraph [ref=f108e126]:
            - strong [ref=f108e127]: Length-to-Diameter
            - text: ratio is the g
            - emphasis [ref=f108e128]: rain overall length
            - text: in relation to the grain
            - emphasis [ref=f108e129]: outer diameter
            - text: . This parameter is very significant in motor design, as larger L/D values tend to result in greater erosive burning effects (including negative erosive burning). High L/D values tend to generate high mass flow rate differentials along the grain length, and may be best served with a
            - emphasis [ref=f108e130]: tapered
            - text: core or
            - emphasis [ref=f108e131]: stepped
            - text: core diameters (largest nearer the nozzle).
