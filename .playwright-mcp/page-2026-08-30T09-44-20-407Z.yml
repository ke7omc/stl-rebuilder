          - article [ref=f138e72]:
            - generic [ref=f138e73]:
              - heading "Themes" [level=1] [ref=f138e74]
              - text: "Last update: 09.07.2026"
            - generic [ref=f138e77]:
              - paragraph [ref=f138e78]:
                - text: Theme options allow the user to choose the application-wide coloring (dark or light) best suited to their tastes or needs. Since this change affects the entire application, the choice of default theme should be part of the initial preference setup (user onboarding) on first usage of the product. If a product does not offer a user onboarding process, then the dark theme should be used by default. The theme selector also is typically found with other user preferences in the software’s settings options. See
                - link "Color palettes and their usage" [ref=f138e79] [cursor=pointer]:
                  - /url: ./colors.md#color-palettes-and-their-usage
                - text: for details about the dark and light theme palettes.
              - heading "Dark theme" [level=2] [ref=f138e80]
              - paragraph [ref=f138e81]: In the dark theme, interface controls are subdued and elegant, allowing the content in the main viewing area, such as results of a 3D simulation, to stand out boldly as the application’s centerpiece. This option is also easier on the eyes when viewing an application for a long period of time. The dark theme, however, does not lend itself to screen captures for use in printed documents.
              - paragraph [ref=f138e82]:
                - link [ref=f138e83] [cursor=pointer]:
                  - /url: /sites/default/files/git_ansys/markdown_f869fe854e37fdf588a4e9d550f09174_automation/bbbf973f7771f1fd27a93c68897851a7.png
                  - img "A picture containing text, screenshot, multimedia software, software Description automatically generated" [ref=f138e84]
              - paragraph [ref=f138e85]: "Figure 20: UI in the dark theme"
              - heading "Light theme" [level=2] [ref=f138e86]
              - paragraph [ref=f138e87]: Some users may prefer a brighter alternative. The light theme evokes the legacy interfaces of Ansys’ products, offering a sense of familiarity to our users who are used to those applications and their coloration. It is also suitable for screen captures intended for use in printed documents. The light theme, however, can be harder on the eyes when viewing an application for a long period of time.
              - paragraph [ref=f138e88]:
                - link [ref=f138e89] [cursor=pointer]:
                  - /url: /sites/default/files/git_ansys/markdown_f869fe854e37fdf588a4e9d550f09174_automation/cba147f10e1f8b82ad955b207bb80224.png
                  - img "A picture containing text, screenshot, operating system, software Description automatically generated" [ref=f138e90]
              - paragraph [ref=f138e91]: "Figure 21: UI in the light theme"
