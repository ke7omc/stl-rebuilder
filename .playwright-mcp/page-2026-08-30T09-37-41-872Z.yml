              - generic "Skewness" [ref=f8e237]:
                - heading "Skewness" [level=4] [ref=f8e242]
                - paragraph [ref=f8e243]:
                  - strong [ref=f8e245]: Skewness
                  - text: measures how different a mesh cell or face is from its perfect shape, like an equilateral triangle or square.
                  - strong [ref=f8e247]: Skewness
                  - text: "is one of the primary quality measures for a mesh. For Ideal and Skewed Triangles, refer the following figure:"
                - generic [ref=f8e248]:
                  - paragraph [ref=f8e249]: "Figure 51: Ideal and Skewed Triangles and Quadrilaterals"
                  - img "Ideal and Skewed Triangles and Quadrilaterals" [ref=f8e252]
                - paragraph [ref=f8e253]: The following table lists the range of skewness values and its corresponding cell quality.
                - table [ref=f8e255]:
                  - rowgroup [ref=f8e259]:
                    - row [ref=f8e260]:
                      - columnheader "Value of Skewness" [ref=f8e261]
                      - columnheader "Cell Quality" [ref=f8e262]
                  - rowgroup [ref=f8e263]:
                    - row [ref=f8e264]:
                      - cell "1" [ref=f8e265]
                      - cell "degenerate" [ref=f8e266]
                    - row [ref=f8e267]:
                      - cell "0.9 — <1" [ref=f8e268]
                      - cell "bad (sliver)" [ref=f8e269]
                    - row [ref=f8e270]:
                      - cell "0.75 — 0.9" [ref=f8e271]
                      - cell "poor" [ref=f8e272]
                    - row [ref=f8e273]:
                      - cell "0.5 — 0.75" [ref=f8e274]
                      - cell "fair" [ref=f8e275]
                    - row [ref=f8e276]:
                      - cell "0.25 — 0.5" [ref=f8e277]
                      - cell "good" [ref=f8e278]
                    - row [ref=f8e279]:
                      - cell ">0 — 0.25" [ref=f8e280]
                      - cell "excellent" [ref=f8e281]
                    - row [ref=f8e282]:
                      - cell "0" [ref=f8e283]
                      - cell "equilateral" [ref=f8e284]
                - paragraph [ref=f8e285]: According to the definition of skewness, a value of 0 indicates an equilateral cell (best) and a value of 1 indicates a completely degenerate cell (worst). Degenerate cells (slivers) are characterized by nodes that are nearly coplanar (colinear in 2D).
                - paragraph [ref=f8e286]: Highly skewed faces and cells are unacceptable because the equations being solved with the assumption that the cells are relatively equilateral or equiangular.
                - paragraph [ref=f8e287]: "Two methods for measuring skewness are:"
                - list [ref=f8e289]:
                  - listitem [ref=f8e290]:
                    - paragraph [ref=f8e291]: Based on the equilateral volume (applies only to triangles and tetrahedra).
                  - listitem [ref=f8e292]:
                    - paragraph [ref=f8e293]: Based on the deviation from a normalized equilateral angle. This method applies to all cell and face shapes, including pyramids and prisms.
                - paragraph
                - heading "Equilateral-Volume-Based Skewness" [level=5] [ref=f8e294]
                - paragraph [ref=f8e295]: In the equilateral volume deviation method, skewness is defined as
                - paragraph [ref=f8e299]: where, the optimal cell size is the size of an equilateral cell with the same circumradius.
                - paragraph [ref=f8e300]: Quality meshes have a skewness value of approximately 0.1 for 2D and 0.4 for 3D. The table above provides a general guide to the relationship between cell skewness and quality.
                - paragraph [ref=f8e301]: In 2D, all cells should be good or better. The presence of cells that are fair or worse indicates poor boundary node placement. You should try to improve your boundary mesh as much as possible, because the quality of the overall mesh can be no better than that of the boundary mesh.
                - paragraph [ref=f8e302]: In 3D, most cells should be good or better, but a small percentage generally in the fair range and there are usually even a few poor cells.
                - generic "Note" [ref=f8e303]:
                  - separator
                  - paragraph [ref=f8e304]:
                    - generic [ref=f8e305]: "Note:"
                    - text: The Equilateral-Volume-Based Skewness quality metric applies to any mesh element that includes a triangular face. For triangular and tetrahedral elements, all faces of which are strictly triangular, the Equilateral-Volume-Based Skewness metric applies directly. For wedge or pyramidal elements, which include combinations of triangular and quadrilateral faces, the Meshing application computes both Equilateral-Volume-Based Skewness metrics (for the triangular faces)
                    - emphasis [ref=f8e307]: and
                    - text: Normalized Equiangular Skewness metrics (for the quadrilateral faces and 3-D element, itself) and reports the maximum computed metric as the element skewness. As a result, Equilateral-Volume-Based Skewness metrics reported for meshes that contain wedge and/or pyramidal elements may include skewness values attributable to Normalized Equiangular Skewness computations.
                  - separator
                - heading "Normalized Equiangular Skewness" [level=5] [ref=f8e308]
                - paragraph [ref=f8e309]: In the normalized angle deviation method, skewness is defined (in general) as
                - paragraph [ref=f8e313]: where
                - blockquote [ref=f8e315]:
                  - paragraph [ref=f8e316]:
                    - text: θ
                    - subscript [ref=f8e317]: max
                    - text: = largest angle in the face or cell
                  - paragraph [ref=f8e318]:
                    - text: θ
                    - subscript [ref=f8e319]: min
                    - text: = smallest angle in the face or cell
                  - paragraph [ref=f8e320]:
                    - text: θ
                    - subscript [ref=f8e321]: e
                    - text: = angle for an equiangular face/cell (60 for a triangle, 90 for a square)
                - paragraph [ref=f8e322]: For a pyramid, the cell skewness will be the maximum skewness computed for any face. An ideal pyramid (skewness = 0) is one in which the 4 triangular faces are equilateral (and equiangular) and the quadrilateral base face is a square. The guidelines in the table above apply to the normalized equiangular skewness as well.
