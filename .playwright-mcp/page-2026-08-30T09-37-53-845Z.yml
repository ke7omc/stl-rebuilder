  - paragraph
  - paragraph [ref=f12e53]:
    - strong [ref=f12e55]: Node Density and Clustering
  - separator [ref=f12e56]
  - paragraph
  - paragraph [ref=f12e57]: Since you are discretely defining a continuous domain, the degree to which the salient features of the flow (such as shear layers, separated regions, shock waves, boundary layers, and mixing zones) are resolved , depends on the density and distribution of nodes in the mesh. In many cases, poor resolution in critical regions can dramatically alter the flow characteristics. For example, the prediction of separation due to an adverse pressure gradient depends heavily on the resolution of the boundary layer upstream of the point of separation.
  - paragraph [ref=f12e58]: Resolution of the boundary layer (i.e., mesh spacing near walls) also plays a significant role in the accuracy of the computed wall shear stress and heat transfer coefficient . This is particularly true in laminar flows where the mesh adjacent to the wall should obey
  - paragraph [ref=f12e59]
