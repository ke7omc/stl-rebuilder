  - separator [ref=f12e16]
  - heading "6.2.2 Mesh Quality" [level=2] [ref=f12e18]
  - paragraph
  - paragraph [ref=f12e19]: The quality of the mesh plays a significant role in the accuracy and stability of the numerical computation. The attributes associated with mesh quality are node point distribution, smoothness, and skewness.
  - paragraph [ref=f12e20]: "Regardless of the type of mesh used in your domain, checking the quality of your mesh is essential. Depending on the cell types in the mesh (tetrahedral, hexahedral, polyhedral, etc.), different quality criteria are evaluated:"
  - paragraph
  - list [ref=f12e21]:
    - listitem [ref=f12e22]:
      - text: Cell squish on all meshes (Section
      - link "31.4" [ref=f12e23] [cursor=pointer]:
        - /url: node984.htm#fvdefs
      - text: ). Cell Squish is a measure used to quantify how far a cell deviates from orthogonality with respect to its faces.
      - paragraph
    - listitem [ref=f12e24]:
      - text: Cell equivolume skew on tri/tet elements (Section
      - link "31.4" [ref=f12e25] [cursor=pointer]:
        - /url: node984.htm#fvdefs
      - text: ).
      - paragraph
    - listitem [ref=f12e26]:
      - text: Face squish on polyhedral meshes (Section
      - link "31.4" [ref=f12e27] [cursor=pointer]:
        - /url: node984.htm#fvdefs
      - text: ).
      - paragraph
    - listitem [ref=f12e28]: Aspect ratio on all meshes.
  - paragraph [ref=f12e29]:
    - text: "The aspect ratio is a measure of the stretching of a cell. It is computed as the ratio of the maximum value to the minimum value of any of the following distances: the distances between the cell centroid and face centroids, and the distances between the cell centroid and nodes. For a unit cube (see Figure"
    - link "6.2.2" [ref=f12e30] [cursor=pointer]:
      - /url: node167.htm#fig-aspect-rat2
    - text: ), the maximum distance is 0.866, and the minimum distance is 0.5, so the aspect ratio is 1.732. This type of definition can be applied on any type of mesh, including polyhedral.
  - paragraph
  - paragraph
  - table [ref=f12e32]:
    - caption [ref=f12e33]:
      - strong [ref=f12e34]: "Figure 6.2.2:"
      - text: Calculating the Aspect Ratio for a Unit Cube
    - rowgroup [ref=f12e35]:
      - row [ref=f12e36]:
        - cell [ref=f12e37]:
          - img "figure" [ref=f12e38]
  - paragraph
  - paragraph [ref=f12e39]: "To check the quality of your mesh, you can use the Report Quality button in the General task page:"
  - paragraph [ref=f12e40]:
    - img "figure" [ref=f12e41]
    - generic [ref=f12e42]: General
    - img "figure" [ref=f12e43]
    - generic [ref=f12e44]: Report Quality
  - paragraph [ref=f12e45]: A message will be printed to the console. The example below provides an example of the output.
  - paragraph
  - paragraph
