  - paragraph [ref=f12e95]:
    - text: Equation
    - link "6.2-1" [ref=f12e96] [cursor=pointer]:
      - /url: node167.htm#eq5.2.1
    - text: is based upon the Blasius solution for laminar flow over a flat plate at zero incidence [
    - link "69" [ref=f12e97] [cursor=pointer]:
      - /url: node1483.htm#schlichting
    - text: "]."
  - paragraph [ref=f12e98]:
    - text: Proper resolution of the mesh for turbulent flows is also very important. Due to the strong interaction of the mean flow and turbulence, the numerical results for turbulent flows tend to be more susceptible to mesh dependency than those for laminar flows. In the near-wall region, different mesh resolutions are required depending on the near-wall model being used. See Section
    - link "12.3" [ref=f12e99] [cursor=pointer]:
      - /url: node409.htm#turb-mesh
    - text: for guidelines.
  - paragraph [ref=f12e100]:
    - text: In general, no flow passage should be represented by fewer than 5 cells. Most cases will require many more cells to adequately resolve the passage. In regions of large gradients, as in shear layers or mixing zones, the mesh should be fine enough to minimize the change in the flow variables from cell to cell. Unfortunately, it is very difficult to determine the locations of important flow features in advance. Moreover, the mesh resolution in most complicated 3D flow fields will be constrained by CPU time and computer resource limitations (i.e., memory and disk space). Although accuracy increases with larger meshes, the CPU and memory requirements to compute the solution and postprocess the results also increase. Solution-adaptive mesh refinement can be used to increase and/or decrease mesh density based on the evolving flow field, and thus provides the potential for more economical use of grid points (and hence reduced time and resource requirements). See Chapter
    - link "27" [ref=f12e101] [cursor=pointer]:
      - /url: node841.htm#chp-adapt
    - text: for information on solution adaption.
  - paragraph [ref=f12e102]:
    - strong [ref=f12e104]: Smoothness
  - separator [ref=f12e105]
  - paragraph
  - paragraph [ref=f12e106]:
    - text: Truncation error is the difference between the partial derivatives in the governing equations and their discrete approximations. Rapid changes in cell volume between adjacent cells translate into larger truncation errors. ANSYS FLUENT provides the capability to improve the smoothness by refining the mesh based on the change in cell volume or the gradient of cell volume. For information on refining the mesh based on change in cell volume. (See Sections
    - link "27.3" [ref=f12e107] [cursor=pointer]:
      - /url: node847.htm#GradientAdaption
    - text: and
    - link "27.7" [ref=f12e108] [cursor=pointer]:
      - /url: node855.htm#VolumeAdaption
    - text: ).
  - paragraph [ref=f12e109]:
    - strong [ref=f12e111]: Cell Shape
  - separator [ref=f12e112]
  - paragraph
  - paragraph [ref=f12e113]: The shape of the cell (including its skewness, aspect ratio, and squish) also has a significant impact on the accuracy of the numerical solution.
  - paragraph
  - list [ref=f12e114]:
    - listitem [ref=f12e115]:
      - text: Skewness is defined as the difference between the shape of the cell and the shape of an equilateral cell of equivalent volume. Highly skewed cells can decrease accuracy and destabilize the solution. For example, optimal quadrilateral meshes will have vertex angles close to 90 degrees, while triangular meshes should preferably have angles of close to 60 degrees and have all angles less than 90 degrees. A general rule is that the maximum skewness for a triangular/tetrahedral mesh in most flows should be kept below 0.95, with an average value that is less than 0.33. A maximum value above 0.95 may lead to convergence difficulties and may require changing the solver controls, such as reducing under-relaxation factors and/or switching to the pressure-based coupled solver.
      - paragraph
    - listitem [ref=f12e116]:
      - text: Aspect ratio is a measure of the stretching of the cell. As discussed in Section
      - link "6.1.3" [ref=f12e117] [cursor=pointer]:
        - /url: node164.htm#cpu-expense
      - text: ", for highly anisotropic flows, extreme aspect ratios may yield accurate results with fewer cells. Generally, it is best to avoid aspect ratios in excess of 5:1 in the bulk flow (away from the walls). The quadrilateral/hexahedral/wedge cells inside the boundary layer, on the other hand, can be stretched to aspect ratio of up to 10:1 in most cases. With regard to the stability of the flow solution, it can go as high as possible; however, with regard to the stability of the energy solution, the maximum aspect ratio should be kept below 35:1."
      - paragraph
    - listitem [ref=f12e118]:
      - text: Squish index is computed for cells using the vector from the cell centroid to each of its faces and the corresponding face area vector. The worst cells will have a cell squish index close to 1, with better cells closer to 0. For tetrahedral meshes, you can use either skewness or cell squish index to measure the mesh quality. Skewness information is not available for polyhedral meshes, so you must rely on the cell squish index and an additional index for the face squish (which is computed using the vector connecting the centroids of adjacent cells). A good rule of thumb is that the maximum skewness for tetrahedral cells should less be than 0.95. The maximum cell squish index for all types of cells should be less than 0.99.
      - paragraph [ref=f12e119]: Cell size change and face warp are additional quality measure that could affect stability and accuracy. See the TGrid User's Guide for more details.
      - paragraph
  - paragraph [ref=f12e120]:
    - strong [ref=f12e122]: Flow-Field Dependency
  - separator [ref=f12e123]
  - paragraph [ref=f12e124]: The effect of resolution, smoothness, and cell shape on the accuracy and stability of the solution process is dependent on the flow field being simulated. For example, very skewed cells can be tolerated in benign flow regions, but can be very damaging in regions with strong flow gradients.
  - paragraph [ref=f12e125]: Since the locations of strong flow gradients generally cannot be determined a priori, you should strive to achieve a high-quality mesh over the entire flow domain.
  - paragraph
