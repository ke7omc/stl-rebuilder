        - heading "BATES Grain (and EndBurner)" [level=2] [ref=f107e54]
        - figure [ref=f107e55]:
          - link [ref=f107e56] [cursor=pointer]:
            - /url: /wiki/File:Bates_Grain.png
        - paragraph [ref=f107e59]: A BATES grain is a simple cored cylinder which burns on the core and end surfaces. End surfaces can be inhibited. This is the most common propellant grain type. A BATES grain can be configured to burn progressively or regressively depending on length. If you want an End Burning grain, specify the core diameter as zero. When doing so, BurnSim will assume one end is inhibited and the other is not, thus only burning from one end.
        - heading "C-Slot Grain" [level=2] [ref=f107e60]
        - figure [ref=f107e61]:
          - link [ref=f107e62] [cursor=pointer]:
            - /url: /wiki/File:Slot.png
        - paragraph [ref=f107e65]: A C-Slot grain consists of a cylinder with a lengthwise slot removed from the side of the grain. The grain burns on the slot/core surface and grain ends. End surfaces can be inhibited. C-Slot grains are often used to give a longer burn time by providing a larger web thickness than is possible with a BATES grain in the same diameter. Disadvantages include increased case insulation requirements along the edge of the grain surrounding the slot.
        - heading "D-Grain" [level=2] [ref=f107e66]
        - figure [ref=f107e67]:
          - link [ref=f107e68] [cursor=pointer]:
            - /url: /wiki/File:Dgrain.png
        - paragraph [ref=f107e71]: A D-Grain is a simple cylinder with a slice removed from the side, resulting in the end of the grain appearing in the shape of the letter D. The grain burns on the ends and flat surface of the 'D'. The ends can be inhibited. D-Grains can provide a very large web thickness in a given grain diameter, allowing for long burns. Thermal issues are more of a concern with this configuration due to the large area of the motor case that is exposed to the flame front for the entire burn.
        - heading "Moon Burner" [level=2] [ref=f107e72]
        - figure [ref=f107e73]:
          - link [ref=f107e74] [cursor=pointer]:
            - /url: /wiki/File:Moon.png
        - paragraph [ref=f107e77]: A moon burner grain so named due to the shape of the grain as the propellant burns. The grain is similar to a BATES grain, with the exception of the core being offset rather than down the center. The grain burns on the end surfaces and in the core, the ends can be inhibited. The moon burner grain is another way to increase web thickness but reduces thermal concerns since the flame front is only exposed to the side of the motor case for part of the burn.
        - heading "Star Grain" [level=2] [ref=f107e78]
        - figure [ref=f107e79]:
          - link [ref=f107e80] [cursor=pointer]:
            - /url: /wiki/File:Star.png
        - paragraph [ref=f107e83]: The star grain has a core in the shape of a star. The grain burns on the core surface as well as the ends, and the ends can be inhibited. A star grain can be used to get a neutral burn, and reduce the amount of heat transferred to the case.
        - heading "X-Core" [level=2] [ref=f107e84]
        - figure [ref=f107e85]:
          - link [ref=f107e86] [cursor=pointer]:
            - /url: /wiki/File:Xcore.png
        - paragraph [ref=f107e89]: An X-Core grain is similar to a star grain except the core is in the shape of an X instead of a star. Its primary advantage is ease of manufacture compared to a star grain.
        - heading "Fin-o-cyl" [level=2] [ref=f107e90]
        - figure [ref=f107e91]:
          - link [ref=f107e92] [cursor=pointer]:
            - /url: /wiki/File:Finocyl.png
        - paragraph [ref=f107e95]: A Fin-o-cyl grain consists of a grain with a cylindrical core, like a BATES grain, but then has 'fins' added. Its advantages are similar to that of the star grain but is easier to manufacture.
        - heading "Tapered Core (BurnSim 4)" [level=2] [ref=f107e96]
        - paragraph [ref=f107e97]: A Tapered Core grain is an end burner with a hole drilled part-way (or all the way) down its axis. The core can be a straight cylinder or a taper - a diameter at base (the aft, mouth end) narrowing to a smaller core tip diameter further in. If the core stops short of the forward end (a blind core), the plug of propellant ahead of the tip can't burn from the closed side, so the head end is normally inhibited; a core that runs the full length behaves like a tapered BATES grain instead. The grain burns on the core surface and the aft face (the core mouth), and the head end can optionally be left uninhibited only when the core runs the whole length.
        - paragraph [ref=f107e98]:
          - text: Unlike every other grain type, a Tapered Core's cross-section genuinely changes along the axis - it's an annulus near the mouth, a smaller annulus further in if tapered, and a full disc past the core tip - so BurnSim simulates and draws it from a meridional half-section rather than the usual constant-cross-section extrusion every other type uses. Both cross-section views (end view and longitudinal cutaway) reflect this directly. Because a blind core builds up mass flow fast over a short axial run, erosive burning (see
          - link "Erosive Burning" [ref=f107e99] [cursor=pointer]:
            - /url: /wiki/Erosive_Burning
          - text: ) is particularly relevant to this grain type.
        - heading "Custom Grains (BurnSim 4)" [level=2] [ref=f107e100]
        - paragraph [ref=f107e101]:
          - text: BurnSim 4 adds a custom grain shape editor for cores that don't fit any of the standard types above - you can sketch a shape directly, or import one from a DXF, SVG, or raster image. The custom shape is still simulated through the same pixel-based eroder used for every other grain type. See
          - link "Custom Grain Import" [ref=f107e102] [cursor=pointer]:
            - /url: /wiki/Custom_Grain_Import
          - text: for how to build or import a custom cross-section.
