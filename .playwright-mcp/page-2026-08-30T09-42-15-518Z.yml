        - list [ref=f134e173]:
          - listitem [ref=f134e174]:
            - paragraph [ref=f134e175]:
              - strong [ref=f134e176]: Xcode Personal Team.
              - text: "If you’re signing in to Xcode with an Apple Account that’s not affiliated with the Apple Developer Program, you’ll be able to perform on-device testing for personal use (Xcode refers to this as a Personal Team). However, there are some limitations to this type of development workflow that require you to re-provision the app to your device periodically, such as:"
            - list [ref=f134e177]:
              - listitem [ref=f134e178]: The number of App IDs that can be registered your account at one time is limited to 10 and each expires after 7 days.
              - listitem [ref=f134e179]: The number of test devices that can be registered to your account for each platform is limited to 3 and each expires after 7 days.
              - listitem [ref=f134e180]: Provisioning profiles will expire 7 days from issuance, which may require you to rebuild and re-install your app to your device after expiration.
        - heading "Other programs" [level=2] [ref=f134e181]
        - heading "App Store Small Business Program" [level=3] [ref=f134e182]
        - paragraph [ref=f134e183]: This program features a reduced commission rate of 15% on paid apps and in-app purchases, helping you to invest more resources into your business so you can continue building great apps.
        - paragraph [ref=f134e184]:
          - link "Learn about the program " [ref=f134e185] [cursor=pointer]:
            - /url: /app-store/small-business-program/
        - heading "Apple Developer Enterprise Program" [level=3] [ref=f134e186]
        - paragraph [ref=f134e187]: Organizations with specific use cases that require private distribution directly to employees through a secure internal system or a Mobile Device Management solution may be eligible for this program.
        - paragraph [ref=f134e188]:
          - link "Learn about eligibility requirements " [ref=f134e189] [cursor=pointer]:
            - /url: /programs/enterprise/
        - heading "Apple Video Partner Program" [level=3] [ref=f134e190]
        - paragraph [ref=f134e191]: This program is designed for apps that deliver premium subscription video entertainment services on the Apple TV app. Participating apps are required to integrate with a number of Apple technologies, such as Universal Search, Siri, AirPlay, and single sign-on or zero sign-on, to ensure a seamless experience for users.
        - paragraph [ref=f134e192]:
          - link "Learn about the program " [ref=f134e193] [cursor=pointer]:
            - /url: /programs/video-partner/
        - heading "MFi Program" [level=3] [ref=f134e194]
        - paragraph [ref=f134e195]: If you plan to develop or manufacture accessories that use MFi technologies, such as the Find My network or HomeKit, the MFi Program provides the licenses and resources you need.
        - paragraph [ref=f134e196]:
          - link "Learn about licensing MFi technologies " [ref=f134e197] [cursor=pointer]:
            - /url: /programs/mfi/
        - heading "News Partner Program" [level=3] [ref=f134e198]
        - paragraph [ref=f134e199]: This program is designed for subscription news publications that provide their content to Apple News in Apple News Format. Publishers that work with Apple News may qualify for a commission rate of 15% on qualifying in-app purchase subscriptions from day one.
        - paragraph [ref=f134e200]:
          - link "Learn about the program " [ref=f134e201] [cursor=pointer]:
            - /url: /programs/news-partner/
        - heading "Security Research Device Program" [level=3] [ref=f134e202]
        - paragraph [ref=f134e203]: Help improve the security of iOS devices by testing for vulnerabilities on a special Security Research Device.
        - paragraph [ref=f134e204]:
          - link "Learn about applying for a Security Research Device " [ref=f134e205] [cursor=pointer]:
            - /url: /programs/security-research-device/
