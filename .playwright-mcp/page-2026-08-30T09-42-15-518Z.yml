  - main [ref=f134e66]:
    - article [ref=f134e67]:
      - generic [ref=f134e71]:
        - heading "Choosing a Membership" [level=1] [ref=f134e72]
        - paragraph [ref=f134e73]: It’s never been easier to develop for Apple platforms. To get started with app development for iOS, iPadOS, macOS, tvOS, visionOS, and watchOS, simply download Xcode from the Mac App Store. If you’re ready to distribute apps to customers, the Apple Developer Program provides everything you need to build apps with advanced capabilities and make them available worldwide. You can also distribute custom apps to specific businesses or proprietary apps within your organization.
      - generic [ref=f134e77]:
        - heading "Who should enroll" [level=2] [ref=f134e78]
        - paragraph [ref=f134e79]:
          - text: You can learn how to develop apps for Apple platforms for free without enrolling. With just an Apple Account, you can access Xcode, software downloads, documentation, sample code, forums, and Feedback Assistant, as well as test your apps on devices. If you don’t already have an Apple Account, you can
          - link "create one now" [ref=f134e80] [cursor=pointer]:
            - /url: https://account.apple.com/
          - text: . To distribute apps, join the Apple Developer Program.
        - heading "About the Apple Developer Program" [level=2] [ref=f134e81]
        - paragraph [ref=f134e82]: If you’re interested in creating apps for distribution on the App Store, Apple Business Manager, or Apple School Manager, join the Apple Developer Program.* Membership includes access to beta OS releases, advanced app capabilities, and tools needed to develop, test, and distribute apps and Safari Extensions.
        - paragraph [ref=f134e83]:
          - strong [ref=f134e84]: Individuals or sole proprietors/single-person businesses.
          - text: Apps are listed under the developer’s personal name.
        - paragraph [ref=f134e85]:
          - strong [ref=f134e86]: Organizations.
          - text: Apps are listed under the organization’s legal entity name. Companies and educational institutions must provide a
          - generic [ref=f134e87]: D-U-N-S
          - text: Number (available for free) registered to their legal entity during the enrollment process.
        - paragraph [ref=f134e88]:
          - text: Enrollment is 99 USD (or in local currency where available) per membership year. Your nonprofit, educational institution, or government entity may be eligible for a
          - link "fee waiver" [ref=f134e89] [cursor=pointer]:
            - /url: /support/membership-fee-waiver/
          - text: .
        - paragraph [ref=f134e90]:
