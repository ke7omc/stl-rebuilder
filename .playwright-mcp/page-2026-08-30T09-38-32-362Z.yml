            - generic [ref=f31e103]:
              - paragraph [ref=f31e104]:
                - text: The use of mesh quality metrics is an essential part of the automatic generation of unstructured initial meshes for finite elements. Without them, it is difficult to determine if the generated mesh possesses even the minimal quality necessary to undertake a computational analysis. This is especially true for the automatic generation of hexahedral meshes because few hexahedral mesh generation algorithms provide guarantees of even minimal mesh quality.
