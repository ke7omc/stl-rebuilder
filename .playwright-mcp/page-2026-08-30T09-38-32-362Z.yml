                    - iframe
              - paragraph [ref=f31e113]: "The “quality” of a mesh cell can be quantified in several ways. ANSYS performs several geometrical checks on mesh elements in order to determine their quality. These checks, or metrics are:"
              - list [ref=f31e114]:
                - listitem [ref=f31e115]: Element Quality
                - listitem [ref=f31e116]: Aspect Ratio Calculation for Triangles
                - listitem [ref=f31e117]: Aspect Ratio Calculation for Quadrilaterals
                - listitem [ref=f31e118]: Jacobian Ratio
                - listitem [ref=f31e119]: Warping Factor
                - listitem [ref=f31e120]: Parallel Deviation
                - listitem [ref=f31e121]: Maximum Corner Angle
                - listitem [ref=f31e122]: Skewness
                - listitem [ref=f31e123]: Orthogonal Quality
              - heading "Element Quality" [level=2] [ref=f31e124]
              - paragraph [ref=f31e125]:
                - text: The Element Quality is based on the ratio of the volume to the sum of the square of the edge lengths for 2D quad/tri elements, or the square root of the cube of the sum of the square of the edge lengths for 3D elements.
                - link "Comparing CAD Software" [ref=f31e126] [cursor=pointer]
              - figure [ref=f31e130]
              - paragraph [ref=f31e131]:
                - text: A value of 1 indicates a perfect cube or square while a value of 0 indicates that the element has a zero or negative volume.
                - link "Trying Animation Software" [ref=f31e132] [cursor=pointer]
              - heading "Aspect Ratio" [level=2] [ref=f31e136]
              - paragraph [ref=f31e137]: The aspect ratio of a triangle provides a comparison of the “height” and “width” of a triangle. It varies from 1 to infinite. A value of 1.0 indicates an equilateral triangle. The image below shows triangles with aspect ratios of 1 and 20.
              - figure [ref=f31e138]
              - paragraph [ref=f31e139]: The aspect ratio of quadrilaterals provides a comparison of a long side to a short side of the quadrilateral. It varies from 1 to infinite. A value of 1.0 indicates a square. The image below shows quadrilaterals with aspect ratios of 1 and 20.
              - figure [ref=f31e140]
              - heading "Jacobian Ratio" [level=2] [ref=f31e141]
              - paragraph [ref=f31e142]:
                - text: The Jacobian ratio is a measurement of the shape of a given element compared to that of an ideal element. The ideal shape of an element depends on element type. The ideal Jacobian ratio is 1.0 and a good quality mesh has a Jacobian ratio between 1 and 10 for the majority of its elements (90% and above).
                - link "Finding Math Tutors" [ref=f31e143] [cursor=pointer]
              - figure [ref=f31e147]
              - heading "Warping Factor" [level=2] [ref=f31e148]
              - paragraph [ref=f31e149]:
                - text: The warping factor is computed and tested for some quadrilateral shell elements, and the quadrilateral faces of bricks, wedges, and pyramids. The ideal warping factor is 0. Warping is a measure of twisting and distortion and is best understood by looking at quadrilaterals with varying warping factors.
                - link "Trying Animation Software" [ref=f31e150] [cursor=pointer]
              - figure [ref=f31e154]
              - heading "Parallel Deviation" [level=2] [ref=f31e155]
              - paragraph [ref=f31e156]: Parallel deviation is a measure of how much two parallel sides of a shape deviate. The ideal parallel deviation is 0 for a square.
              - figure [ref=f31e157]
              - heading "Maximum Corner Angle" [level=2] [ref=f31e158]
              - paragraph [ref=f31e159]: This is the maximum angle between adjacent edges of an element. For a triangle the best maximum angle is 60 degrees. For a quadrilateral it is 90 degrees.
              - figure [ref=f31e160]
              - heading "Skewness" [level=2] [ref=f31e161]
              - paragraph [ref=f31e162]: Skewness is one of the primary quality measures for a mesh. Skewness determines how close to ideal (equilateral or equiangular) a face or cell is.
              - figure [ref=f31e163]
              - figure [ref=f31e164]
              - heading "Orthogonal Quality" [level=2] [ref=f31e165]
              - paragraph [ref=f31e166]:
                - text: It involves the angle between the vector connecting two mesh nodes (or control volumes) and the normal vector for each surface integration point (n) associated with that edge. The range for orthogonal quality is 0-1, where a value of 0 is worst and a value of 1 is best.
                - link "Trying Animation Software" [ref=f31e167] [cursor=pointer]
