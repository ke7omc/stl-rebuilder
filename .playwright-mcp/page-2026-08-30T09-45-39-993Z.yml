              - paragraph [ref=f148e195]: Notice how the settings change the facets along the edge of the circle. The interior is a flat plane, so 45-degree triangles are the most efficient facets.
              - paragraph [ref=f148e196]: The example on the left shows the default Max distance of 0.75mm. This refers to the gap seen in the zoomed-in (top) image. Decreasing the Max distance to 0.01mm results in more facets along the edge, which brings the facet edges closer to the cylinder edge, as seen in the example on the right.
              - paragraph [ref=f148e197]: Similarly, decreasing the Max angle will result in more facets along curved edges. This example shows the result of decreasing the Max angle from 20 degrees to 1 degree.
